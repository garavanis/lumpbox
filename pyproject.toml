[project]
name = "lumpbox"
version = "0.1.0"
description = "Lumped-mass (mass-spring-damper) system simulation in Python, built on JAX"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Giorgos Aravanis", email = "georgios.aravanis@polimi.it" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "scipy",
    "jax",
    "equinox>=0.13.8",
    "diffrax>=0.7.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
